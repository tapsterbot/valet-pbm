[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valet-pbm"
version = "0.1.0"
description = "Control a Valet Push Button Module (PBM) from a Raspberry Pi using DYNAMIXEL Protocol 2.0"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tapster Robotics" }]
keywords = ["valet", "tapster", "dynamixel", "raspberry-pi", "robotics", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
]
dependencies = [
    "dynamixel-sdk==4.1.0",
    "gpiozero",
    # gpiozero's preferred pin backend on Raspberry Pi OS. lgpio is published
    # only as an sdist, so it needs `python3-dev swig liblgpio-dev` to build.
    # Limit it to Linux on ARM so installs on other machines don't try.
    "lgpio; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'armv7l' or platform_machine == 'armv6l')",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
]

[project.urls]
Homepage = "https://valetnet.dev/"
Source = "https://github.com/tapsterbot/valet-pbm"
Issues = "https://github.com/tapsterbot/valet-pbm/issues"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["pbm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "hardware: needs a connected PBM; skipped unless pytest runs with --hardware",
]
filterwarnings = [
    # lgpio's SWIG-generated bindings on Python 3.13+.
    "ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning",
]
